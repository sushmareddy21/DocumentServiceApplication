# Server Configuration (Railway sets the PORT variable automatically)
server.port=${PORT:8080}
spring.application.name=document-service

# --- Database (Railway PostgreSQL) ---
# Railway provides these variables automatically when you add a database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Logging (Cleaner for Production) ---
logging.level.org.hibernate.SQL=WARN
logging.level.com.knowledgebase=INFO
logging.level.org.springframework.ai=INFO

# --- File Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# --- AWS S3 (You will set these in Railway) ---
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_S3_REGION}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# --- OpenAI (Brain) ---
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.chat.options.temperature=0.7

# --- Pinecone (Memory) ---
spring.ai.vectorstore.pinecone.apiKey=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.environment=${PINECONE_ENVIRONMENT}
spring.ai.vectorstore.pinecone.project-id=${PINECONE_PROJECT_ID}
spring.ai.vectorstore.pinecone.index-name=knowledge-base
spring.ai.vectorstore.pinecone.namespace=default

# --- CORS (Crucial for Vercel Frontend) ---
# You will set ALLOWED_ORIGINS to your Vercel URL later (e.g., https://my-app.vercel.app)
allowed.origins=${ALLOWED_ORIGINS}